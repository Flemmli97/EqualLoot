modLoader="javafml"
loaderVersion="[${neoforge_loader_version},)"
license="${license}"
issueTrackerURL="${sources_url}"
[[mixins]]
config = "${mod_id}.mixins.json"
[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
